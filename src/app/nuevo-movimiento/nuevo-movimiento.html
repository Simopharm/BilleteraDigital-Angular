<div class="card shadow-sm">

  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">Nuevo Movimiento</h5>
  </div>

  <div class="card-body">

    <form (ngSubmit)="registrarMovimiento()">

      <div class="mb-3">
        <label for="tipo" class="form-label">
          Tipo de movimiento
        </label>

        <select id="tipo" name="tipo" class="form-select" [(ngModel)]="tipo">
          <option value="Gasto">Gasto</option>
          <option value="Recarga">Recarga</option>

        </select>
      </div>

      <div class="mb-3">
        <label for="monto" class="form-label">
          Monto (S/)
        </label>

        <input type="number" id="monto" name="monto" class="form-control" placeholder="Ingrese un monto" min="0.01"
          step="0.01" [(ngModel)]="monto">
      </div>

      @if (saldoInsuficiente) {
      <div class="alert alert-danger">
        Saldo insuficiente.
      </div>
      }

      @if (monto !== null && !montoValido) {
      <div class="alert alert-warning">
        Ingresa un monto válido mayor que cero.
      </div>
      }

      <button type="submit" class="btn btn-primary w-100" [disabled]="!formularioValido">
        Registrar movimiento
      </button>
    </form>
  </div>
</div>
